<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub — платформы</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/platforms.css">
</head>

<body>
  <header class="header">
    <div class="container header__inner">
      <a href="./index.html" class="logo">Game<span>Hub</span></a>

      <nav class="nav">
        <a href="./index.html" class="nav__link">Игры</a>
        <a href="./platforms.html" class="nav__link active">Платформы</a>
        <a href="./favorites.html" class="nav__link">Избранное</a>
      </nav>

      <label class="theme-switch">
        <input type="checkbox" id="themeToggle">

        <span class="theme-switch__slider">
          <img
            src="./assets/svg/sun.svg"
            alt=""
            class="theme-switch__icon theme-switch__sun"
          >

          <img
            src="./assets/svg/moon.svg"
            alt=""
            class="theme-switch__icon theme-switch__moon"
          >

          <span class="theme-switch__circle"></span>
        </span>
      </label>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <p class="page-header__subtitle">GAME HUB</p>

        <h1>Платформы</h1>

        <p>
          Выбери платформу и изучи доступные игры.
        </p>
      </div>
    </section>

    <section class="platforms">
      <div class="container">
        <div
          id="platformsContainer"
          class="platforms-grid"
        >
          <div class="loader">Загрузка платформ...</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 GameHub</p>
      <p>Powered by RAWG</p>
    </div>
  </footer>

  <script src="./js/theme.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/platforms.js"></script>
</body>
</html>
